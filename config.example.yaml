keepa_api_key: ""          # set KEEPA_API_KEY in .env
discord_webhook_url: ""    # set DISCORD_WEBHOOK_URL in .env

# Brand / product-level discounts applied on top of any category discount.
# match: single substring that must appear in title (case-insensitive)
# matches: list of substrings that ALL must appear in title (case-insensitive)
# type: "percent" (of raw supplier price) or "fixed" (£ amount)
# value: discount amount
# min_price: (optional) only apply if raw supplier price >= this value
brand_discounts:
  - match: "Logitech"
    type: percent
    value: 20
  - match: "Dyson"
    type: percent
    value: 10
  - matches: ["gaming", "laptop"]
    type: fixed
    value: 100
    min_price: 799

scraper:
  max_pages_per_category: 1
  request_delay_seconds: 4
  proxy:
    server: "http://PROXY_HOST:PORT"   # placeholder = proxy disabled; set PROXY_SERVER in .env
    username: ""   # set PROXY_USERNAME in .env
    password: ""   # set PROXY_PASSWORD in .env

keepa:
  max_lookups_per_run: 500
  domain: "GB"

roi:
