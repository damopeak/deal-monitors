arbisource:
  watch_unmatched: false      # matched feed only; unmatched is a firehose
  vat_registered: true        # uses ArbiSource's VAT-adjusted profit figures
  ping_on_elite: true         # @here for score >= 75
  wide_feed: true               # bypass ArbiSource's own pre-filter; our gates do the judging
  costs:
    inbound_shipping_cost: 0      # ArbiSource charges this PER KG — left at 0 on purpose
    storage_months: 0
  filter:
    inbound_per_unit: 1.00    # flat £/unit inbound shipping, deducted locally
    min_roi: 20.0             # % at the 90-day average selling price, not spot
    min_profit: 4.00          # £ at the 90-day average
    min_profit_spot: 2.00     # £ at today's price
    max_cost: 250.0
    max_bsr_percent: 1.0
    min_rank_drops_30: 15     # per variation
    max_sellers: 25
    min_confidence: 0.85
    max_keepa_age_days: 120
    spike_tolerance: 1.20     # reject if current price >20% above 90d average
    decline_tolerance: 0.90   # reject if 30d average <90% of 90d average
    require_in_stock: false   # out-of-stock drops pass through, flagged + penalised
    require_green_ip: false   # IP-flagged drops pass through, flagged + penalised
    penalty_out_of_stock: 15.0   # score penalty; set 0 to rank them like any other
    penalty_ip_flag: 0.0       # not penalised — IP flags are judged manually
    suspect_discount: 80.0          # % off at which a drop is treated as a likely mis-scrape
    suspect_discount_blocks_ping: true   # such drops post, but never fire an @here
    excluded_categories:
      - Large Appliances
      - PC & Video Games
      - Video Games
      - CDs & Vinyl
      - Music
      - DVD & Blu-ray
      - Movies & TV
    excluded_keywords:              # big electricals + games/discs
      - fridge
      - freezer
      - dishwasher
      - washing machine
      - washer dryer
      - tumble dryer
      - range cooker
      - cooker hood
      - extractor hood
      - electric hob
      - gas hob
      - induction hob
      - built-in oven
      - electric cooker
      - gas cooker
      - chest freezer
      - playstation
      - xbox
      - nintendo switch
      - ps5
      - ps4
      - blu-ray
      - dvd
    category_allow_keywords:        # rescued from an excluded category (accessories, not games)
      - keyboard
      - mouse
      - headset
      - headphones
      - controller
      - monitor
      - webcam
      - microphone
      - chair
      - ssd
      - hard drive
      - graphics card
      - cable
      - hub
      - dock
      - speaker
      - router
    exclude_hazmat: false      # DG-flagged tools pass through, flagged + penalised
    penalty_hazmat: 0.0        # account has dangerous-goods approval — no penalty
    hard_max_bsr_percent: 5.0  # absolute BSR ceiling; max_bsr_percent only binds if slow
    exclude_oversized: false
    exclude_amazon_on_listing: true
    tier_elite: 65
    tier_strong: 35

currys:
  # Currently the same channel as argos: below — Currys deals post as
  # "Currys Monitor" so the two are distinguishable.
  webhook_url: ""   # set in .env (see .env.example)

hukd:
  webhook_url: ""   # set in .env (see .env.example)
  interval: 300        # seconds between checks
  min_roi: 20          # % on cash paid
  min_profit: 3.0      # GBP per unit
  min_monthly_sales: 10

argos:
  webhook_url: ""   # set in .env (see .env.example)
  poll_minutes: 5          # price-drop feed check
  scan_interval_hours: 3   # full Argos scan via ArbiSource
  min_roi_cash: 20.0       # % of price paid inc VAT, after the Keepa re-check
  min_profit_now: 2.0      # GBP per unit, VAT-registered (today and at the 90d avg)
  filter:                  # Argos-only overrides on top of arbisource: filter
    min_rank_drops_30: 8               # rank drops in 30 days...
    divide_drops_by_variations: false  # ...across the whole listing
    spike_tolerance: 99                # Amazon above its 90d avg is fine...
    min_profit: 2.0                    # ...if it still makes £2 and 20% ROI at the 90d avg
    exclude_amazon_on_listing: false   # Amazon on the listing is fine, shared Buy Box or not

tkmaxx:
  webhook_url: ""   # set in .env (see .env.example)
  poll_minutes: 5          # price-drop feed check
  scan_interval_hours: 3   # full TK Maxx scan via ArbiSource
  min_roi_cash: 20.0       # same gates as argos:
  min_profit_now: 2.0
  filter:                  # same overrides as argos: filter
    min_rank_drops_30: 8
    divide_drops_by_variations: false
    spike_tolerance: 99
    min_profit: 2.0
    exclude_amazon_on_listing: false
